[package]
name = "winnow-db"
version = "0.1.0"
edition = "2021"
description = "High-performance vector database for the browser, powered by WASM and WebGPU."
license = "MIT"
repository = "https://github.com/salah55s/winnow-db"
documentation = "https://github.com/salah55s/winnow-db#readme"
homepage = "https://github.com/salah55s/winnow-db"
authors = ["WinnowDB Team"]
keywords = ["vector-database", "wasm", "webgpu", "search", "approximate-nearest-neighbor"]
categories = ["database", "wasm", "web-programming"]
exclude = ["examples/*", "tests/*", "docs/*"]

[features]
default = []
parallel = ["rayon", "wasm-bindgen-rayon"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
lru = "0.16.3"
hex = "0.4.3"
aes-gcm = "0.10.3"
pbkdf2 = "0.12.2"
sha2 = "0.10.8"
rand = "0.8.5"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
js-sys = "0.3.85"
serde-wasm-bindgen = "0.4"
md-5 = "0.10.6"
crc32fast = "1.5.0"
web-sys = { version = "0.3", features = ["console", "AbortSignal", "Window", "AbortController"] }
serde_json = "1.0"
rayon = { version = "1.8", optional = true }
wasm-bindgen-rayon = { version = "1.2", optional = true }
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
wasm-bindgen-futures = "0.4"
futures = "0.3"
parking_lot = { version = "0.12", features = ["send_guard"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"


[lib]
crate-type = ["cdylib", "rlib"]

